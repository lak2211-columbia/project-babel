name: Weekly Corpus Freshness Watch

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      jurisdiction:
        description: "Optional jurisdiction filter (leave blank for all 5 jurisdictions)"
        required: false
        default: ""
      timeout:
        description: "Per-request HTTP timeout in seconds"
        required: false
        default: "15"

permissions:
  contents: read
  issues: write

jobs:
  freshness-watch:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: services/pipeline/src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "services/pipeline"

      - name: Validate taxonomy
        run: python -m observatory.cli validate-taxonomy

      - name: Validate source manifests
        run: python -m observatory.cli validate-sources

      - name: Validate repository artifacts against JSON schemas
        run: python -m observatory.cli validate-artifacts

      - name: Verify corpus evidence grounding
        run: python -m observatory.cli check-grounding

      - name: Check official source freshness (non-mutating HEAD/GET probes)
        env:
          FRESHNESS_TIMEOUT: ${{ inputs.timeout || '15' }}
          FRESHNESS_JURISDICTION: ${{ inputs.jurisdiction || '' }}
        run: |
          ARGS=("--timeout=${FRESHNESS_TIMEOUT}")
          if [ -n "${FRESHNESS_JURISDICTION}" ]; then
            ARGS+=("--jurisdiction=${FRESHNESS_JURISDICTION}")
          fi
          python -m observatory.cli check-freshness "${ARGS[@]}"

      - name: Upload freshness drift report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshness-watch-report
          retention-days: 30
          path: |
            data/source_tracking/freshness_report.json
            data/source_tracking/freshness_report.md

      - name: Open or update GitHub issue on drift or broken official URLs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const jsonPath = "data/source_tracking/freshness_report.json";
            const mdPath = "data/source_tracking/freshness_report.md";
            if (!fs.existsSync(jsonPath)) {
              core.warning("freshness_report.json not found; skipping issue sync.");
              return;
            }
            const report = JSON.parse(fs.readFileSync(jsonPath, "utf8"));
            const mdBody = fs.existsSync(mdPath) ? fs.readFileSync(mdPath, "utf8") : "";
            const hasDrift = Boolean(report.has_actionable_drift);
            const labelName = "freshness-watch";
            const issueTitle = "Weekly Freshness Watch: Official Source Drift or Broken Links Detected";

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
              });
            } catch (err) {
              if (err.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  color: "d97706",
                  description: "Automated weekly corpus freshness watch alerts",
                });
              }
            }

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: labelName,
              per_page: 10,
            });
            const openIssue = existing.data[0];

            if (!hasDrift) {
              core.info("No actionable drift or broken links detected.");
              if (openIssue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: openIssue.number,
                  body: `All ${report.checked_count} checked official sources passed without actionable drift on \`${report.generated_at}\`. Closing alert.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: openIssue.number,
                  state: "closed",
                });
              }
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Automated freshness check run: ${runUrl}`,
              "",
              mdBody.slice(0, 58000),
            ].join("\n");

            if (openIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssue.number,
                title: issueTitle,
                body,
              });
              core.info(`Updated existing freshness-watch issue #${openIssue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body,
                labels: [labelName],
              });
              core.info(`Opened freshness-watch issue #${created.data.number}`);
            }
