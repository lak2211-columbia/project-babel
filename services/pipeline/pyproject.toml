[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "observatory-pipeline"
version = "0.1.0"
description = "Pipeline primitives for the AI Governance Observatory"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5.0",
  "cryptography>=44.0,<46.0",
  "jsonschema>=4.23,<5.0",
  "playwright>=1.52,<2.0",
  "pydantic>=2.11,<3.0",
  "pymupdf>=1.25,<2.0",
  "pypdf>=5.4,<6.0",
  "psycopg[binary]>=3.2,<4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0"
]

[project.scripts]
observatory = "observatory.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
