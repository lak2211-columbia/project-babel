name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e services/pipeline[dev]
      - name: Validate taxonomy
        run: PYTHONPATH=services/pipeline/src python -m observatory.cli validate-taxonomy
      - name: Run tests
        run: |
          cd services/pipeline
          pytest
